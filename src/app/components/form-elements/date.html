<mat-form-field class="w-full">
    <mat-label>{{ element()?.label || 'Label' }}</mat-label>
    <input (click)="$event.stopPropagation()" matInput [placeholder]="element()?.placeholder || 'Enter a value'" [required]="element()?.required" [matDatepicker]="picker">
    <mat-hint>MM/DD/YYYY</mat-hint>
    <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
</mat-form-field>
